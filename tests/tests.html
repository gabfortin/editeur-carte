<!DOCTYPE html>
<html lang="fr-CA">
<head>
<meta charset="UTF-8">
<title>Tests · Éditeur de carte</title>
<style>
  body { font: 14px/1.5 system-ui, sans-serif; margin: 24px; }
  .ok { color: #15803d; } .ko { color: #b91c1c; font-weight: 700; }
  #summary { font-size: 18px; font-weight: 700; margin-bottom: 12px; }
  iframe { width: 900px; height: 500px; border: 1px solid #ccc; margin-top: 16px; }
</style>
</head>
<body>
<p>Lancer depuis la racine du projet : <code>python3 -m http.server 8001</code> puis ouvrir <code>/tests/tests.html</code>.</p>
<div id="summary">Tests en cours…</div>
<ol id="results"></ol>
<iframe id="viewer" title="Carte exportée"></iframe>
<meta name="app-version" content="test">
<script src="../js/csv.js"></script>
<script src="../js/sanitize.js"></script>
<script src="../js/icons.js"></script>
<script src="../js/model.js"></script>
<script>
  // export-html.js charge ses morceaux en chemins relatifs à la racine : on le fait depuis /tests/
  window.__base = '../';
</script>
<script src="../js/export-html.js"></script>
<script>
(async function () {
  const results = document.getElementById('results');
  let pass = 0, fail = 0;
  function check(label, cond, detail) {
    const li = document.createElement('li');
    li.className = cond ? 'ok' : 'ko';
    li.textContent = (cond ? '✓ ' : '✗ ') + label + (cond || detail === undefined ? '' : ' — ' + detail);
    results.appendChild(li);
    cond ? pass++ : fail++;
  }

  const text = await (await fetch('exemple-mapme.csv')).text();

  // ── CSV ──
  const parsed = CSV.parse(text);
  check('8 lignes de données lues', parsed.records.length === 8, parsed.records.length);
  check('12 colonnes', parsed.header.length === 12, parsed.header.length);
  check('séparateur virgule détecté', parsed.delimiter === ',');
  const d0 = parsed.records[0].description;
  check('description multiligne conservée', d0.split('\n').length > 3);
  check('guillemets doublés décodés', d0.includes('href="https://www.facebook.com/exemple"'));
  check('champ vide = chaîne vide', parsed.records[1].name === '' && parsed.records[1].categories === 'Itinérance et lutte à la pauvreté');
  check('aller-retour CSV identique octet pour octet', CSV.serialize(parsed.header, parsed.records, parsed) === text,
    'différence au caractère ' + [...CSV.serialize(parsed.header, parsed.records, parsed)].findIndex((c, i) => c !== text[i]));
  const semi = CSV.parse('a;b;c\r\n1;"x;y";3\r\n');
  check('séparateur point-virgule et CRLF', semi.delimiter === ';' && semi.eol === '\r\n' && semi.records[0].b === 'x;y');
  check('BOM ignoré', CSV.parse('﻿name,latitude\nA,1\n').header[0] === 'name');

  // ── Modèle ──
  const p = Model.projectFromCsv(parsed, 'exemple-mapme.csv');
  check('rôles reconnus (Mapme)', p.roles.name === 'name' && p.roles.lat === 'latitude' && p.roles.lng === 'longitude' && p.roles.id === 'mapmeId' && p.roles.actionUrl === 'actionUrl');
  check('toCsv sans modification = fichier d\'origine', Model.toCsv(p) === text);
  const a = Model.analyse(p);
  const issueOf = (id) => a.issues.get(p.features.find(f => f.row.mapmeId === id).uid);
  check('ligne sans position repérée', issueOf('d6422fb2-d312-4786-aa84-726446951852') === 'sans-position');
  check('ligne presque vide repérée', issueOf('1a664c6c-ac3d-43f7-9087-0eab9213b8ed') === 'sans-position');
  check('lieu à Madrid repéré comme loin', issueOf('0dd6ab4d-3b50-4497-b6ff-74ddf5f13fc8') === 'loin');
  check('lieu normal sans problème', issueOf('059151de-dbd1-4614-9fca-2e9c2fd7f989') === undefined);
  check('catégories découpées', Model.getCategories(p, p.features[0]).length === 3);
  check('couleurs attribuées à chaque catégorie', [...Model.categoryStats(p).keys()].every(c => /^#/.test(p.settings.categoryColors[c])));
  check('icône attribuée à chaque catégorie, et elle existe', [...Model.categoryStats(p).keys()].every(c => Icons.has(p.settings.categoryIcons[c])));
  check('style proposé selon le nom', Model.defaultStyle('Espaces verts').icon === 'trees' && Model.defaultStyle('AccèsLogis et Logement social').icon === 'house' &&
    Model.defaultStyle('Développement communautaire et social').icon === 'users' && Model.defaultStyle('Vélo et mobilité active').icon === 'bike');
  check('catégorie inconnue : repère', Model.defaultStyle('Zzz') === null && Model.iconOf(p, { row: { categories: '' } }) === Model.DEFAULT_ICON);
  check('icône d\'un lieu = celle de sa première catégorie', Model.iconOf(p, p.features[0]) === p.settings.categoryIcons[Model.getCategories(p, p.features[0])[0]]);
  p.settings.categoryIcons['Espaces verts'] = 'dog';
  Model.assignColors(p);
  check('un choix d\'icône n\'est jamais remplacé', p.settings.categoryIcons['Espaces verts'] === 'dog');
  check('icônes gardées au rechargement du projet', Model.revive(JSON.parse(JSON.stringify(p))).settings.categoryIcons['Espaces verts'] === 'dog');
  check('le CSV ne contient pas les icônes', Model.toCsv(p) === text);
  check('toutes les icônes de la liste existent', Icons.list.every(x => Icons.has(x.id)) && Icons.list.length >= 60);

  const moved = p.features[3];
  const before = JSON.stringify(p.features.filter(f => f !== moved).map(f => f.row));
  Model.setLatLng(p, moved, [45.5, -73.6]);
  check('déplacement : seule latitude/longitude du lieu changent', moved.row.latitude === '45.5' && moved.row.longitude === '-73.6' &&
    JSON.stringify(p.features.filter(f => f !== moved).map(f => f.row)) === before && moved.row.address === '7330 Rue Coffee, Montréal, QC H4B 1K1, Canada');

  const path = [[45.52, -73.58], [45.53, -73.57], [45.535, -73.565]];
  const line = Model.newFeature(p, 'line', path);
  p.features.push(line);
  Model.set(p, line, 'name', 'Piste test');
  check('ligne : colonne geometry ajoutée en fin', p.columns[p.columns.length - 1] === 'geometry' && p.features[0].row.geometry === '');
  check('ligne : WKT relu identique', JSON.stringify(Model.getPath(p, line)) === JSON.stringify(path));
  check('ligne : identifiant généré', /^[0-9a-f-]{36}$/.test(line.row.mapmeId));
  const reparsed = Model.projectFromCsv(CSV.parse(Model.toCsv(p)), 'x.csv');
  const relu = reparsed.features.find(f => f.row.name === 'Piste test');
  check('ligne : survit à un aller-retour CSV', relu && Model.kind(reparsed, relu) === 'line' && Model.getPath(reparsed, relu).length === 3);
  // Ligne rattachée à un point (colonne parentId)
  const pt = p.features[0];
  const ptRow = JSON.stringify(pt.row);
  check('rattachement : aucun au départ', Model.getParent(p, line) === null && !p.roles.parent);
  Model.setParent(p, line, pt);
  check('rattachement : colonne parentId ajoutée en fin, avec l\'id du point', p.columns[p.columns.length - 1] === 'parentId' && line.row.parentId === pt.row.mapmeId);
  check('rattachement : point retrouvé et ligne listée sous le point', Model.getParent(p, line) === pt && Model.childrenOf(p, pt)[0] === line);
  check('rattachement : la ligne prend la couleur et l\'icône du point', Model.colorOf(p, line) === Model.colorOf(p, pt) && Model.iconOf(p, line) === Model.iconOf(p, pt));
  check('rattachement : la rangée du point n\'est pas modifiée (hors colonne ajoutée)', JSON.stringify(Object.assign({}, pt.row, { parentId: undefined })) === JSON.stringify(Object.assign(JSON.parse(ptRow), { parentId: undefined })));
  const rp = Model.projectFromCsv(CSV.parse(Model.toCsv(p)), 'x.csv');
  const rl = rp.features.find(f => f.row.name === 'Piste test');
  check('rattachement : survit à un aller-retour CSV', rl && Model.getParent(rp, rl) && Model.getParent(rp, rl).row.mapmeId === pt.row.mapmeId);
  const sansId = Model.newFeature(p, 'point', [45.51, -73.57]); sansId.row.mapmeId = ''; p.features.push(sansId);
  const l2 = Model.newFeature(p, 'line', path); p.features.push(l2);
  Model.setParent(p, l2, sansId);
  check('rattachement à un point sans identifiant : un UUID lui est donné', /^[0-9a-f-]{36}$/.test(sansId.row.mapmeId) && Model.getParent(p, l2) === sansId);
  Model.setParent(p, l2, null);
  check('détacher vide le lien', l2.row.parentId === '' && Model.getParent(p, l2) === null);
  check('une ligne ne peut pas être le « point » d\'une autre', (Model.setParent(p, l2, line), Model.getParent(p, l2) === null));
  p.features.splice(p.features.indexOf(l2), 1);
  p.features.splice(p.features.indexOf(sansId), 1);

  // Zones (polygones)
  const ringWkt = 'POLYGON ((-73.58 45.52, -73.57 45.52, -73.57 45.53, -73.58 45.52))';
  const g1 = Model.parseGeometry(ringWkt);
  check('zone : POLYGON lu, anneau ouvert en mémoire', g1.type === 'area' && g1.path.length === 3 && g1.path[0][0] === 45.52 && g1.path[0][1] === -73.58);
  check('zone : WKT écrit fermé (1er sommet répété)', Model.toWkt(g1.path, 'area') === ringWkt);
  check('zone : GeoJSON Polygon accepté', Model.parseGeometry('{"type":"Polygon","coordinates":[[[-73.5,45.5],[-73.6,45.5],[-73.6,45.6],[-73.5,45.5]]]}').type === 'area');
  check('zone : moins de 3 sommets refusée', Model.parseGeometry('POLYGON ((-73.5 45.5, -73.6 45.5, -73.5 45.5))') === null);
  const sq = [[45.5, -73.6], [45.5, -73.6 + 100 / (111320 * Math.cos(45.5 * Math.PI / 180))], [45.5 + 100 / 111195, -73.6 + 100 / (111320 * Math.cos(45.5 * Math.PI / 180))], [45.5 + 100 / 111195, -73.6]];
  check('zone : superficie d\'un carré de 100 m ≈ 10 000 m²', Math.abs(Model.areaM2(sq) - 10000) < 100, Model.areaM2(sq));
  const zone = Model.newFeature(p, 'area', g1.path);
  p.features.push(zone);
  Model.set(p, zone, 'name', 'Zone test');
  check('zone : nouvelle zone de type area, avec position', Model.kind(p, zone) === 'area' && Model.hasPosition(p, zone) && Model.isShape(p, zone));
  const moved2 = Model.getPath(p, zone); moved2[0] = [45.521, -73.581]; Model.setPath(p, zone, moved2);
  check('zone : déplacer un sommet la garde zone', Model.kind(p, zone) === 'area' && zone.row.geometry.startsWith('POLYGON'));
  Model.setParent(p, zone, pt);
  check('zone : rattachée au point, en prend la couleur', Model.getParent(p, zone) === pt && Model.colorOf(p, zone) === Model.colorOf(p, pt) && Model.childrenOf(p, pt).includes(zone));
  const rz = Model.projectFromCsv(CSV.parse(Model.toCsv(p)), 'x.csv').features;
  const rzone = rz.find(f => f.row.name === 'Zone test');
  check('zone : survit à un aller-retour CSV, avec son rattachement', rzone && rzone.row.geometry === zone.row.geometry && rzone.row.parentId === pt.row.mapmeId);

  check('GeoJSON accepté dans geometry', Model.parseWkt('{"type":"LineString","coordinates":[[-73.5,45.5],[-73.6,45.6]]}')[1][0] === 45.6);

  // ── Nettoyage HTML ──
  const dirty = parsed.records[4].description;
  const clean = Sanitize.html(dirty);
  check('script retiré', !/script|alert\(1\)/.test(clean), clean);
  check('image de tiers retirée', !/<img|pixel/.test(clean), clean);
  check('lien javascript: neutralisé', !/javascript:/i.test(clean) && clean.includes('lien piégé'), clean);
  check('<font> et styles retirés', !/<font|style=/.test(clean), clean);
  check('adresse en clair transformée en lien', clean.includes('<a href="https://montreal.ca/articles/exemple"'), clean);
  const c0 = Sanitize.html(d0);
  check('liens gardés avec target et rel', /<a href="https:\/\/www\.facebook\.com\/exemple" target="_blank" rel="noopener noreferrer">/.test(c0), c0);
  check('pas de <br> ni d\'espace en tête', !/^\s*<br/.test(c0) && c0.startsWith('<p>'), c0.slice(0, 40));
  check('texte vers recherche', Sanitize.text('<p>Un&nbsp;<b>test</b></p>') === 'Un test');

  // ── Export HTML ──
  p.title = 'Carte test <\/script> <b>';
  p.about = 'Texte « à propos ».';
  const html = await ExportHtml.build(p);
  check('page exportée autonome (Leaflet intégré)', html.includes('Leaflet') && !/<script[^>]+src=/.test(html));
  check('titre échappé', html.includes('<title>Carte test &lt;/script&gt; &lt;b&gt;</title>'));
  const back = ExportHtml.extractProject(html);
  check('projet relu depuis la page exportée', back.features.length === p.features.length && back.title === p.title);
  check('description intacte après export', back.features[0].row.description === d0);

  // ── Carte exportée dans un iframe ──
  const frame = document.getElementById('viewer');
  frame.srcdoc = html;
  await new Promise(r => frame.onload = r);
  await new Promise(r => setTimeout(r, 400));
  const doc = frame.contentDocument;
  const items = doc.querySelectorAll('.item');
  // 10 lieux dont 2 sans position → 8 affichés (6 points + 1 ligne + 1 zone, toutes deux rattachées au 1er point, non listées à part)
  check('carte exportée : 6 lieux listés (ligne et zone rattachées comprises dans leur point)', items.length === 6, items.length);
  check('carte exportée : 8 éléments sur la carte', doc.querySelectorAll('.leaflet-interactive').length === 8, doc.querySelectorAll('.leaflet-interactive').length);
  const zonePath = [...doc.querySelectorAll('path.leaflet-interactive')].find(e => e.getAttribute('fill') !== 'none');
  check('carte exportée : zone remplie en semi-transparence', zonePath && Number(zonePath.getAttribute('fill-opacity')) > 0 && Number(zonePath.getAttribute('fill-opacity')) < .5);
  check('carte exportée : lieux en disques avec icône', doc.querySelectorAll('.vw-disc svg').length === 6, doc.querySelectorAll('.vw-disc svg').length);
  check('carte exportée : filtres de catégorie', doc.querySelectorAll('.chip').length === Model.categoryStats(p).size + 1);
  doc.querySelector('.item').click();
  await new Promise(r => setTimeout(r, 2500));
  const pop = doc.querySelector('.leaflet-popup .pop');
  check('carte exportée : fenêtre du lieu ouverte au clic', !!pop, 'aucune fenêtre');
  check('carte exportée : aucune balise script dans la fenêtre', pop && !pop.querySelector('script'));
  frame.contentWindow.document.querySelector('.leaflet-popup-close-button')?.click();
  await new Promise(r => setTimeout(r, 300));
  const pathEl = doc.querySelector('path.leaflet-interactive');
  const box = pathEl.getBoundingClientRect();
  pathEl.dispatchEvent(new MouseEvent('click', { bubbles: true, clientX: box.x + box.width / 2, clientY: box.y + box.height / 2 }));
  await new Promise(r => setTimeout(r, 400));
  const pop2 = doc.querySelector('.leaflet-popup .pop h2');
  check('carte exportée : le tracé rattaché (zone dessinée en premier) ouvre la fiche de son point', pop2 && pop2.textContent === Model.get(p, pt, 'name'), pop2 && pop2.textContent);

  document.getElementById('summary').textContent = fail ? `${fail} échec(s), ${pass} réussi(s)` : `Tous les tests passent (${pass})`;
  document.getElementById('summary').className = fail ? 'ko' : 'ok';
  document.body.dataset.done = fail ? 'fail' : 'pass';
})().catch(e => {
  document.getElementById('summary').textContent = 'Erreur : ' + e.message;
  document.getElementById('summary').className = 'ko';
  document.body.dataset.done = 'error';
  console.error(e);
});
</script>
</body>
</html>
